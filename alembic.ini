[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is deliberately empty: env.py resolves it from settings, so migrations
# always run as the owner role and never as the runtime role.
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
